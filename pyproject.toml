[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "faultbell"
version = "0.1.0"
description = "Drop-in exception alerting for Python services and cron jobs: one scrubbed alert per problem to Discord, Slack, Teams, Google Chat, Telegram, PagerDuty, email or any webhook."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ideator Labs", email = "ideatorlabs.ai@gmail.com" }]
keywords = ["alerting", "exceptions", "discord", "slack", "teams", "telegram", "pagerduty", "email", "webhook", "monitoring", "fastapi", "cron"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "fastapi>=0.100",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/ideatorlabs/faultbell"
Repository = "https://github.com/ideatorlabs/faultbell"
Issues = "https://github.com/ideatorlabs/faultbell/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/faultbell"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ideator"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
packages = ["faultbell"]
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error::DeprecationWarning:faultbell.*",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["faultbell"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
